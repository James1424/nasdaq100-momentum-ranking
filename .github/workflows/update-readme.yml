name: Daily Momentum Update

on:
  # GitHub Actions cron uses UTC time.
  # 22:00 UTC = 00:00 Berlin time during summer time (CEST).
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full update
        run: python run_all.py

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily momentum data update"
          file_pattern: "data/*.csv output/*.csv README.md"
